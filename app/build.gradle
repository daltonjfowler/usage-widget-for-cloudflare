plugins { id 'com.android.application' }
android {
    namespace 'app.usagewidget'
    compileSdk 35
    defaultConfig {
        applicationId 'app.usagewidget'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (rootProject.file('private/release.jks').exists()) {
            personal {
                storeFile rootProject.file('private/release.jks')
                storePassword rootProject.file('private/keypass.txt').text.trim()
                keyAlias 'usage-widget'
                keyPassword rootProject.file('private/keypass.txt').text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('personal') != null) signingConfig signingConfigs.personal
        }
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
